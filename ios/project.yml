# Notes para iOS: la versión NATIVA de notes.dotrino.com (CONVENCIONES §16). La PWA va
# delante; MARKETING_VERSION es la versión de la PWA con la que esta está a la par (§16.3).
#
#   cd ios && xcodegen generate
#   xcodebuild -project Notes.xcodeproj -scheme Notes -destination 'platform=iOS Simulator,name=iPhone 16' test
#
# Firma: equipo DOTRINO S.A.S. (P7G853375S), automática, con los grupos compartidos del
# ecosistema (dotrino-native/docs/DISENO.md §2.1): el perfil es el mismo en todas las apps.
name: Notes
options:
  bundleIdPrefix: com.dotrino
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P7G853375S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 2
packages:
  DotrinoNative:
    path: ../native
targets:
  Notes:
    type: application
    platform: iOS
    sources:
      - Notes
    dependencies:
      - package: DotrinoNative
        product: DotrinoNative
      - package: DotrinoNative
        product: DotrinoNativeUI
    info:
      path: Notes/Info.plist
      properties:
        # «Notes» a secas es el nombre de la app de Apple: App Store Connect lo rechaza (ITMS-90129).
        # El mismo nombre que la ficha; en español lo cambia es.lproj/InfoPlist.strings.
        CFBundleDisplayName: Dotrino Notes
        CFBundleName: Dotrino Notes
        # La versión sale de MARKETING_VERSION / CURRENT_PROJECT_VERSION (§16.3); sin esto xcodegen
        # escribía 1.0 (1) fijo y TestFlight recibía siempre la misma versión.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Cifrado exento, la misma declaración que la app Dotrino (decidido por el dueño, 2026-10-05):
        # así TestFlight no la pide en cada build.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
    entitlements:
      path: Notes/Notes.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dotrino.shared"]
        com.apple.security.application-groups: [group.com.dotrino]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.notes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NotesTests]
    dependencies:
      - target: Notes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notes.app/Notes"
        BUNDLE_LOADER: "$(TEST_HOST)"


schemes:
  Notes:
    build:
      targets:
        Notes: all
    test:
      targets: [NotesTests]
